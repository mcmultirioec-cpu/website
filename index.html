<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Redes Neuronales y Deep Learning, Grupo 4</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600&family=Libre+Franklin:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --pizarra: #1e2b35;
    --pizarra-2: #2a3a46;
    --niebla: #e9edee;
    --papel: #fbfcfc;
    --grafito: #27323a;
    --acero: #55646f;
    --linea: #d3dadd;
    --ocre: #d0a94f;
    --petroleo: #1f5e6b;
    --turquesa: #2ec4b6;
    --titulos: "Bitter", Georgia, serif;
    --texto: "Libre Franklin", Arial, sans-serif;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--niebla);
    color: var(--grafito);
    font-family: var(--texto);
    font-size: 1rem;
    line-height: 1.55;
  }

  a { color: var(--petroleo); }

  :focus-visible {
    outline: 3px solid var(--ocre);
    outline-offset: 2px;
  }

  /* Cabecera */
  .cabecera {
    background: var(--pizarra);
    color: var(--papel);
  }

  .cabecera-interior {
    max-width: 1120px;
    margin: 0 auto;
    padding: 2rem 1.5rem 2.5rem;
    display: grid;
    grid-template-columns: minmax(0, 5fr) minmax(0, 6fr);
    gap: 2rem;
    align-items: center;
  }

  .institucion {
    display: flex;
    align-items: center;
    gap: 0.875rem;
    margin-bottom: 2.25rem;
  }

  .logo {
    flex: none;
    width: 72px;
    height: 72px;
    padding: 6px;
    background: #fff;
    border-radius: 50%;
    display: grid;
    place-items: center;
    overflow: hidden;
    color: var(--pizarra);
    font-size: 0.72rem;
    font-weight: 600;
  }

  .logo img {
    width: 100%;
    height: 100%;
    object-fit: contain;
  }

  .institucion p {
    margin: 0;
    max-width: 18rem;
    font-size: 0.95rem;
    line-height: 1.35;
    color: #cfd8dd;
  }

  h1 {
    margin: 0 0 0.75rem;
    font-family: var(--titulos);
    font-weight: 600;
    font-size: clamp(2.1rem, 4.6vw, 3.25rem);
    line-height: 1.1;
  }

  .grupo {
    margin: 0;
    font-family: var(--titulos);
    font-weight: 500;
    font-size: 1.3rem;
    color: var(--ocre);
  }

  #red {
    min-width: 0;
    height: 320px;
  }

  #red svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .arista {
    stroke: #fff;
    stroke-opacity: 0.13;
    stroke-width: 1;
    transition: stroke-opacity 0.15s, stroke 0.15s;
  }

  .arista.activa {
    stroke: var(--ocre);
    stroke-opacity: 0.85;
  }

  .nodo {
    fill: var(--pizarra-2);
    stroke: #8fa1ac;
    stroke-width: 1.5;
  }

  .nodo.entrada { fill: var(--papel); stroke: var(--papel); }
  .nodo.salida { fill: var(--ocre); stroke: var(--ocre); transition: r 0.15s; }
  .nodo.pendiente { fill: var(--pizarra); stroke: var(--ocre); stroke-dasharray: 3 3; }
  .nodo.salida.activa { r: 10px; }

  .nombre {
    fill: var(--papel);
    font-family: var(--texto);
    font-size: 14px;
    font-weight: 500;
    text-anchor: end;
    dominant-baseline: central;
  }

  .pulso { fill: var(--ocre); }

  /* Listado */
  main {
    max-width: 1120px;
    margin: 0 auto;
    padding: 2.75rem 1.5rem 4rem;
  }

  /* Integrantes */
  .equipo {
    background: #0c1424;
    color: #fff;
    padding: 2.75rem 0 3rem;
  }

  .equipo-interior {
    max-width: 1120px;
    margin: 0 auto;
    padding: 0 1.5rem;
  }

  .equipo h2 { margin-bottom: 1.5rem; }

  .carrusel { position: relative; }

  #integrantes {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    gap: 1.25rem;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    scrollbar-width: none;
  }

  #integrantes::-webkit-scrollbar { display: none; }

  .integrante {
    flex: 0 0 calc((100% - 2.5rem) / 3);
    scroll-snap-align: start;
    padding: 2.5rem 1.5rem 2rem;
    background: #141e36;
    border: 1px solid #27324d;
    border-radius: 14px;
    text-align: center;
  }

  .foto {
    width: 136px;
    height: 136px;
    margin: 0 auto 1.25rem;
    border: 3px solid var(--turquesa);
    border-radius: 50%;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: #1a2542;
    color: #dbe4f0;
    font-size: 2.25rem;
    font-weight: 500;
  }

  .foto img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: cover;
  }

  .integrante h3 {
    margin: 0 0 0.5rem;
    font-family: var(--texto);
    font-size: 1.25rem;
    font-weight: 600;
    line-height: 1.25;
  }

  .integrante p {
    margin: 0;
    color: #9aaac0;
    font-size: 1rem;
    line-height: 1.5;
  }

  .trayectoria {
    list-style: none;
    margin: 1.25rem 0 0;
    padding: 0;
  }

  .trayectoria li {
    padding: 0.45rem 0;
    color: #dbe4f0;
    font-size: 0.95rem;
    line-height: 1.35;

  .periodo {
    display: block;
    margin-top: 0.1rem;
    color: var(--turquesa);
    font-size: 0.875rem;
    font-variant-numeric: tabular-nums;
  }

  .flecha {
    position: absolute;
    top: 88px;

    width: 40px;
    height: 40px;
    display: grid;
    place-items: center;
    padding: 0;
    color: #fff;
    background: #070c16;
    border: 0;
    border-radius: 50%;

  }

  .flecha[hidden] { display: none; }
  .flecha:disabled { opacity: 0.45; cursor: default; }
  .flecha.anterior { left: 0.75rem; }
  .flecha.siguiente { right: 0.75rem; }

  .listado-cabecera {
    display: flex;
    flex-wrap: wrap;
    align-items: baseline;
    justify-content: space-between;
    gap: 0.75rem 2rem;
    margin-bottom: 1.25rem;

  h2 {
    margin: 0;

    font-weight: 600;

    line-height: 1.2;

  #filtros {

    font-weight: 600;

  .portal h3 {

  .portal p {

  .acciones {
    display: flex;

    align-items: center;

  .boton {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 500;
    padding: 0.45rem 1rem;
    color: var(--papel);
    background: var(--petroleo);
    border: 1px solid var(--petroleo);
    border-radius: 3px;

  .enlace { font-size: 0.95rem; }

  #vacio {
    margin: 0;
    padding: 2.5rem 1.25rem;

  /* Visor a pantalla completa */
  #visor {

  .visor-barra {

  .visor-barra h2 {

  .visor-barra a { color: #e4eaed; font-size: 0.95rem; }

  .visor-barra button {
    font: inherit;
    font-size: 0.95rem;
    font-weight: 600;
    padding: 0.35rem 1rem;
    color: var(--pizarra);
    background: var(--papel);
    border: 0;
    border-radius: 3px;

  .visor-cuerpo {

    flex: 1;

  .visor-cuerpo p {
    margin: 0;

    color: var(--acero);

  #visor-marco {
    position: absolute;

  #visor-marco.cargado { background: #fff; }

  @media (max-width: 800px) {
    .cabecera-interior { grid-template-columns: minmax(0, 1fr); padding: 1.5rem 1rem 1.75rem; gap: 1.25rem; }
    .institucion { margin-bottom: 1.5rem; }
    #red { height: 260px; }
    main { padding: 2rem 1rem 3rem; }
    .equipo { padding: 2rem 0 2.25rem; }
    .equipo-interior { padding: 0 1rem; }
    .portal { grid-template-columns: minmax(0, 1fr); padding: 1rem; gap: 0.35rem; }

  @media (max-width: 960px) {
    .integrante { flex-basis: calc((100% - 1.25rem) / 2); }

  @media (max-width: 640px) {
    .integrante { flex-basis: 100%; }
  }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>

        <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>

<main>

    <iframe id="visor-marco" title="Portal seleccionado" allow="fullscreen"></iframe>

<script>
/* =====================================================================
   DATOS DE LOS INTEGRANTES
   Para completar una ficha, llena sus datos y sube la fotografía al
   repositorio con el nombre exacto que indiques en "foto".

   nombre       Nombre visible
   foto         Archivo de la fotografía; con "" se muestran las iniciales
   titulo       Título profesional
   trayectoria  Un renglón por cada período: { periodo: "", cargo: "" }
   ===================================================================== */
const INTEGRANTES = [
  {
    nombre: "Marco Malán",
    foto: "marco-malan.jpg",
    titulo: "Ingeniero en Sistemas, graduado de la ESPOCH",
    trayectoria: [
      { periodo: "2019–2021", cargo: "Maestría en Auditoría Informática" },
      { periodo: "2009–2020", cargo: "Coordinador de TIC" },
      { periodo: "2021–2023", cargo: "Oficial de Seguridad de la Información" },
      { periodo: "2023–2026", cargo: "Auditor informático" }
    ]
  },
  { nombre: "Viviana Pujos", foto: "", titulo: "", trayectoria: [] },
  { nombre: "Carlos Chuncho", foto: "", titulo: "", trayectoria: [] }
];

/* =====================================================================
   AGREGA AQUÍ TUS PORTALES
   Copia el bloque de ejemplo, quítale las marcas de comentario,
   cambia los datos y deja una coma entre un portal y otro.

   titulo       Nombre visible del portal
   descripcion  Una frase sobre su contenido (puede quedar "")
   tipo         Shiny, Python, R, Notebook, Reporte... crea los filtros solo
   url          Enlace completo, o ruta dentro del repositorio
   fecha        Año-mes-día; los más recientes aparecen primero
   incrustar    true: se abre dentro de esta página (Shiny, reportes HTML)
                false: se abre en otra pestaña (código en GitHub, Colab)
   ===================================================================== */
const PORTALES = [

  /*
  {
    titulo: "Nombre del dashboard",
    descripcion: "Qué muestra este dashboard.",
    tipo: "Shiny",
    url: "https://usuario.shinyapps.io/nombre-app/",
    fecha: "2026-11-08",
    incrustar: true
  },
  */

];
/* ===================== FIN DE LA ZONA EDITABLE ===================== */


const MAX_SALIDAS = 12;
const svgNS = "http://www.w3.org/2000/svg";

function urlValida(url) {
  if (typeof url !== "string" || !url.trim()) return false;
  const esquema = url.trim().match(/^([a-z][a-z0-9+.-]*):/i);
  return !esquema || /^https?$/i.test(esquema[1]);
}

const portales = PORTALES
  .filter(p => {
    const ok = p && p.titulo && urlValida(p.url);
    if (!ok) console.warn("Portal omitido: revisa su título y su url.", p);
    return ok;
  })
  .sort((a, b) => String(b.fecha || "").localeCompare(String(a.fecha || "")));

/* Logo: si aún no se ha subido, muestra el nombre */
const logo = document.getElementById("logo");
function logoAlterno() { logo.textContent = "ESPOCH"; }
const imagenLogo = logo.querySelector("img");
imagenLogo.addEventListener("error", logoAlterno);
if (imagenLogo.complete && imagenLogo.naturalWidth === 0) logoAlterno();

/* Red neuronal: cada integrante es una entrada y cada portal una salida */
const contenedorRed = document.getElementById("red");
const reducirMovimiento = matchMedia("(prefers-reduced-motion: reduce)");
let capas = [];
let aristas = [];
let pulsos = [];
let svg = null;

function crear(nombre, atributos, padre) {
  const el = document.createElementNS(svgNS, nombre);
  for (const k in atributos) el.setAttribute(k, atributos[k]);
  padre.appendChild(el);
  return el;
}

function dibujarRed() {
  const w = contenedorRed.clientWidth;
  const h = contenedorRed.clientHeight;
  if (!w || !h) return;

  contenedorRed.textContent = "";
  svg = crear("svg", { viewBox: `0 0 ${w} ${h}` }, contenedorRed);

  const salidas = Math.max(1, Math.min(portales.length, MAX_SALIDAS));
  const tamanos = w < 460 ? [3, 4, salidas] : [3, 5, 4, salidas];
  const xIni = 134;
  const xFin = w - 16;

  capas = tamanos.map((n, c) => {
    const x = xIni + (xFin - xIni) * c / (tamanos.length - 1);
    const paso = n > 1 ? Math.min(62, (h - 28) / (n - 1)) : 0;
    return Array.from({ length: n }, (_, i) => ({ x, y: h / 2 + (i - (n - 1) / 2) * paso }));
  });

  const grupoAristas = crear("g", {}, svg);
  aristas = [];
  capas.slice(0, -1).forEach((capa, c) => {
    capa.forEach((a, ia) => capas[c + 1].forEach((b, ib) => {
      const el = crear("line", { class: "arista", x1: a.x, y1: a.y, x2: b.x, y2: b.y }, grupoAristas);
      aristas.push({ el, capa: c, ia, ib });
    }));
  });

  capas.forEach((capa, c) => capa.forEach((n, i) => {
    let clase = "nodo";
    if (c === 0) clase += " entrada";
    if (c === capas.length - 1) clase += portales.length ? " salida" : " pendiente";
    const nodo = crear("circle", { class: clase, cx: n.x, cy: n.y, r: c === 0 ? 7 : 6 }, svg);
    n.el = nodo;
    if (c === 0) {
      crear("text", { class: "nombre", x: n.x - 16, y: n.y }, svg).textContent = INTEGRANTES[i].nombre;
    }
  }));

  pulsos = [];
  if (!reducirMovimiento.matches) {
    for (let i = 0; i < 4; i++) pulsos.push(nuevoPulso(i * -0.9));
  }
}

function nuevoPulso(inicio) {
  const ruta = capas.map(capa => capa[Math.floor(Math.random() * capa.length)]);
  return { ruta, t: inicio, el: crear("circle", { class: "pulso", r: 3, opacity: 0 }, svg) };
}

let ultimo = 0;
function animar(ahora) {
  const dt = Math.min((ahora - ultimo) / 1000, 0.05);
  ultimo = ahora;
  pulsos.forEach((p, i) => {
    p.t += dt * 0.5;
    const tramos = p.ruta.length - 1;
    if (p.t >= tramos) {
      p.el.remove();
      pulsos[i] = nuevoPulso(-Math.random() * 1.5);
      return;
    }
    if (p.t < 0) return;
    const k = Math.floor(p.t);
    const f = p.t - k;
    const a = p.ruta[k];
    const b = p.ruta[k + 1];
    p.el.setAttribute("cx", a.x + (b.x - a.x) * f);
    p.el.setAttribute("cy", a.y + (b.y - a.y) * f);
    p.el.setAttribute("opacity", 0.9);
  });
  requestAnimationFrame(animar);
}

function resaltarSalida(indice, activa) {
  if (indice >= MAX_SALIDAS || !capas.length) return;
  const ultima = capas.length - 1;
  capas[ultima][indice].el.classList.toggle("activa", activa);
  aristas.forEach(a => {
    if (a.capa === ultima - 1 && a.ib === indice) a.el.classList.toggle("activa", activa);
  });
}

/* Listado y filtros */
const lista = document.getElementById("portales");
const vacio = document.getElementById("vacio");
const filtros = document.getElementById("filtros");
let filtroActual = "Todos";

function fechaLegible(texto) {
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(texto || "");
  if (!m) return "";
  return new Date(+m[1], +m[2] - 1, +m[3])
    .toLocaleDateString("es-EC", { day: "numeric", month: "short", year: "numeric" });
}

function elemento(etiqueta, clase, texto) {
  const el = document.createElement(etiqueta);
  if (clase) el.className = clase;
  if (texto) el.textContent = texto;
  return el;
}

function pintarIntegrantes() {
  const contenedor = document.getElementById("integrantes");
  INTEGRANTES.forEach(i => {
    const ficha = elemento("li", "integrante");

    const iniciales = i.nombre.split(/\s+/).map(parte => parte[0]).join("").slice(0, 2);
    const foto = elemento("div", "foto", i.foto ? "" : iniciales);
    if (i.foto) {
      const img = document.createElement("img");
      img.src = i.foto;
      img.alt = "Fotografía de " + i.nombre;
      img.addEventListener("error", () => { foto.textContent = iniciales; });
      foto.appendChild(img);
    }
    ficha.appendChild(foto);

    ficha.appendChild(elemento("h3", "", i.nombre));
    if (i.titulo) ficha.appendChild(elemento("p", "", i.titulo));

    if (i.trayectoria.length) {
      const lista = elemento("ul", "trayectoria");
      i.trayectoria.forEach(t => {
        const renglon = elemento("li");
        renglon.appendChild(elemento("span", "", t.cargo));
        renglon.appendChild(elemento("span", "periodo", t.periodo));
        lista.appendChild(renglon);
      });
      ficha.appendChild(lista);
    }

    if (!i.titulo && !i.trayectoria.length) {
      ficha.appendChild(elemento("p", "pendiente", "Datos por completar."));
    }

    contenedor.appendChild(ficha);
  });
}

function pintarLista() {
  lista.textContent = "";
  const visibles = portales.filter(p => filtroActual === "Todos" || p.tipo === filtroActual);

  lista.hidden = visibles.length === 0;
  vacio.hidden = visibles.length !== 0;

  visibles.forEach(p => {
    const fila = elemento("li", "portal");
    const indice = portales.indexOf(p);
    fila.addEventListener("mouseenter", () => resaltarSalida(indice, true));
    fila.addEventListener("mouseleave", () => resaltarSalida(indice, false));
    fila.addEventListener("focusin", () => resaltarSalida(indice, true));
    fila.addEventListener("focusout", () => resaltarSalida(indice, false));

    fila.appendChild(elemento("div", "tipo", p.tipo || "Enlace"));

    const info = elemento("div");
    info.appendChild(elemento("h3", "", p.titulo));
    const fecha = fechaLegible(p.fecha);
    const detalle = [p.descripcion, fecha].filter(Boolean).join(" ");
    if (detalle) info.appendChild(elemento("p", "", detalle));
    fila.appendChild(info);

    const acciones = elemento("div", "acciones");
    const enlace = elemento("a", p.incrustar ? "enlace" : "boton", p.incrustar ? "Abrir en otra pestaña" : "Abrir");
    enlace.href = p.url;
    enlace.target = "_blank";
    enlace.rel = "noopener";
    if (p.incrustar) {
      const ver = elemento("button", "boton", "Ver aquí");
      ver.type = "button";
      ver.addEventListener("click", () => abrirVisor(p));
      acciones.appendChild(ver);
    }
    acciones.appendChild(enlace);
    fila.appendChild(acciones);

    lista.appendChild(fila);
  });
}

function pintarFiltros() {
  const tipos = [...new Set(portales.map(p => p.tipo).filter(Boolean))];
  filtros.textContent = "";
  if (tipos.length < 2) return;
  ["Todos", ...tipos].forEach(tipo => {
    const b = elemento("button", "", tipo);
    b.type = "button";
    b.setAttribute("aria-pressed", String(tipo === filtroActual));
    b.addEventListener("click", () => {
      filtroActual = tipo;
      pintarFiltros();
      pintarLista();
    });
    filtros.appendChild(b);
  });
}

/* Visor */
const visor = document.getElementById("visor");
const marco = document.getElementById("visor-marco");

function abrirVisor(p) {
  document.getElementById("visor-titulo").textContent = p.titulo;
  document.getElementById("visor-abrir").href = p.url;
  marco.classList.remove("cargado");
  marco.src = p.url;
  visor.showModal();
}

marco.addEventListener("load", () => {
  if (marco.getAttribute("src")) marco.classList.add("cargado");
});
document.getElementById("visor-cerrar").addEventListener("click", () => visor.close());
visor.addEventListener("close", () => marco.removeAttribute("src"));

/* Carrusel de integrantes: las flechas aparecen cuando no caben todas las fichas */
const pista = document.getElementById("integrantes");
const anterior = document.getElementById("anterior");
const siguiente = document.getElementById("siguiente");

function actualizarFlechas() {
  const maximo = pista.scrollWidth - pista.clientWidth;
  anterior.hidden = siguiente.hidden = maximo <= 1;
  anterior.disabled = pista.scrollLeft <= 1;
  siguiente.disabled = pista.scrollLeft >= maximo - 1;
}

function desplazar(direccion) {
  const paso = pista.firstElementChild.offsetWidth + parseFloat(getComputedStyle(pista).columnGap);
  pista.scrollBy({ left: direccion * paso, behavior: reducirMovimiento.matches ? "auto" : "smooth" });
}

anterior.addEventListener("click", () => desplazar(-1));
siguiente.addEventListener("click", () => desplazar(1));
pista.addEventListener("scroll", actualizarFlechas, { passive: true });
new ResizeObserver(actualizarFlechas).observe(pista);

/* Inicio */
pintarIntegrantes();
actualizarFlechas();
pintarFiltros();
pintarLista();
dibujarRed();
new ResizeObserver(dibujarRed).observe(contenedorRed);
requestAnimationFrame(animar);
</script>
